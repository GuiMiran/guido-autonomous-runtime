name: Autonomy control plane MVP
on:
  push:
    paths:
      - 'autonomy/**'
      - '.github/workflows/autonomy-mvp.yml'
  pull_request:
    paths:
      - 'autonomy/**'
      - '.github/workflows/autonomy-mvp.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests (no network/provider required)
        working-directory: autonomy
        run: npm test
